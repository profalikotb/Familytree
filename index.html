
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>شجرة العائلة | Family Tree</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">
  <link rel="preconnect"
        href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#e8f0f8,#f7f9fc);
      font-family: 'Cairo', sans-serif;
      padding: 20px;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 440px;
      padding: 45px 30px;
      text-align: center;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(28,65,110,.12);
    }

    .symbol {
      font-size: 52px;
      margin-bottom: 15px;
    }

    h1 {
      color: #153e70;
      font-size: 34px;
      font-weight: 900;
      margin: 0 0 15px;
    }

    p {
      font-size: 17px;
      font-weight: 700;
      line-height: 2;
      color: #566779;
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      background: linear-gradient(135deg,#1759a5,#2376c5);
      color: #fff;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 13px;
      font-family: 'Cairo',sans-serif;
      font-size: 19px;
      font-weight: 800;
      transition: .2s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(23,89,165,.25);
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      font-weight: 600;
      color: #8897a7;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="symbol">🌳</div>

    <h1>شجرة العائلة</h1>

    <p>
      سجّل تاريخ عائلتك، وتعرّف على جذورك،
      واحتفظ بروابط الأجيال في مكان واحد.
    </p>

    <a class="btn"
       href="https://script.google.com/macros/s/AKfycbwj6QYtUyPsOMEuxmfXbGXaEO2cPAq0X8F2BnCwo9FONizIjyEVAUX3o_E5gDRwHqA/exec">
      افتح تطبيق شجرة العائلة
    </a>

    <div class="footer">
      جذورنا تجمعنا، وأجيالنا امتداد لتاريخنا
    </div>
  </main>
</body>
</html>
